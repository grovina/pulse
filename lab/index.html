<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The body</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div class="stage">
    <header class="top">
      <div class="identity">
        <p class="kicker">Pulse lab</p>
        <h1>The body</h1>
        <p class="lede" id="run-blurb">The model. Play lives the next minutes. Feelings are read off the markers.</p>
      </div>
      <div class="chrome">
        <nav class="stimuli" aria-label="What the body does">
          <label class="plate-wrap">
            <span class="sr">Plate</span>
            <select id="plate">
              <option value="plate" selected>Plate 50/12/18</option>
              <option value="snack">Snack 20/4/4</option>
              <option value="rich">Rich 40/25/25</option>
            </select>
          </label>
          <button type="button" id="eat">Eat</button>
          <button type="button" id="walk">Walk</button>
          <button type="button" id="rest">Lie down</button>
        </nav>
        <nav class="protocols" id="protocols" aria-label="Starting scenes"></nav>
      </div>
    </header>

    <div class="work">
      <section class="field" aria-label="Module coupling graph">
        <div class="badges" id="badges" aria-live="polite"></div>
        <nav class="layers" id="layers" aria-label="Layers"></nav>
        <svg id="graph" viewBox="0 0 1100 860" role="img" aria-labelledby="graph-title">
          <title id="graph-title">Pulse modules, couplings, and conserved loops</title>
          <g id="edges"></g>
          <g id="loops"></g>
          <g id="nodes"></g>
          <g id="waypoints"></g>
          <g id="sats"></g>
        </svg>
        <p class="hint" id="hint">Eat, walk, or lie down. Play steps the model. Nothing past now is shown.</p>
      </section>

      <aside class="readout" aria-label="Readout">
        <h2>Now</h2>
        <p class="clock" id="clock">08:00</p>
        <div class="feelings" id="feelings"></div>
        <p class="phase" id="phase"></p>
        <div id="readout-rows"></div>
        <div id="ledger"></div>
        <h3 id="module-heading">Module</h3>
        <div id="module-rows"></div>
      </aside>
    </div>

    <footer class="transport">
      <button type="button" id="play" aria-pressed="false">Play</button>
      <label class="time-wrap">
        <span class="sr">Time</span>
        <input id="scrub" type="range" min="0" max="0" value="0" step="1">
      </label>
      <label class="num">
        Speed
        <select id="speed">
          <option value="20">20×</option>
          <option value="80" selected>80×</option>
          <option value="240">240×</option>
          <option value="720">720×</option>
        </select>
      </label>
      <label class="explode-wrap">
        Explode
        <input id="explode" type="range" min="0" max="100" value="0" step="1">
      </label>
    </footer>
  </div>
  <script src="viewer.js"></script>
</body>
</html>
